<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Smart Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Minimal Login Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .login-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
        }
        .login-container h1 i { color: #0d9488; }
        .login-container p.sub {
            color: #64748b;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .login-btn:hover { background: #1e293b; }
        .error-msg {
            color: #ef4444;
            background: #fef2f2;
            padding: 0.7rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }
        .footer-text { text-align: center; margin-top: 1.5rem; color: #94a3b8; font-size: 0.9rem; }
        .chain-badge-login {
            text-align: center;
            margin-top: 1.5rem;
            color: #64748b;
            font-size: 0.75rem;
        }
        .chain-badge-login i { color: #10b981; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1><i class="fas fa-hexagon"></i> HealthChain</h1>
        <p class="sub">Sign in to access the Smart Consulting System</p>
        
        <div id="error-message" class="error-msg">Invalid credentials</div>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email"><i class="far fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="admin@healthchain.com" value="demo@health.com">
            </div>
            <div class="input-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="••••••••" value="password123">
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>
        </form>
        
        <div class="chain-badge-login">
            <i class="fas fa-circle"></i> Blockchain Network: Sepolia (Live)
        </div>
    </div>

    <script type="module">
        import { loginUser } from '../js/api.js';

        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await loginUser(email, password);
            
            if (result.success) {
                // Store user in session and redirect to dashboard
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = '../index.html'; // Go to dashboard
            } else {
                errorDiv.innerText = result.message || 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
